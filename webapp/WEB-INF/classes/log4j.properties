### direct log messages to stdout ###
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{ABSOLUTE} %5p %c{1}:%L - %m%n

log4j.category.com.opensymphony.webwork=INFO
log4j.category.org.apache.struts2=INFO
log4j.category.org.apache=INFO
log4j.category.catalia=INFO


### direct messages to file hibernate.log ###
#log4j.appender.file=org.apache.log4j.FileAppender
#log4j.appender.file.File=hibernate.log
#log4j.appender.file.layout=org.apache.log4j.PatternLayout
#log4j.appender.file.layout.ConversionPattern=%d{ABSOLUTE} %5p %c{1}:%L - %m%n

### set log levels - for more verbose logging change 'info' to 'debug' ###

log4j.rootLogger=warn, stdout

#log4j.logger.org.hibernate=info
log4j.logger.org.hibernate=warn

### log HQL query parser activity
#log4j.logger.org.hibernate.hql.ast.AST=debug

### log just the SQL
#log4j.logger.org.hibernate.SQL=debug

### log JDBC bind parameters ###
log4j.logger.org.hibernate.type=info
#log4j.logger.org.hibernate.type=debug

### log schema export/update ###
log4j.logger.org.hibernate.tool.hbm2ddl=debug

### log HQL parse trees
#log4j.logger.org.hibernate.hql=debug

### log cache activity ###
#log4j.logger.org.hibernate.cache=debug

### log transaction activity
#log4j.logger.org.hibernate.transaction=debug

### log JDBC resource acquisition
#log4j.logger.org.hibernate.jdbc=debug

### enable the following line if you want to track down connection ###
### leakages when using DriverManagerConnectionProvider ###
#log4j.logger.org.hibernate.connection.DriverManagerConnectionProvider=trace

### Redam WARN "Going to buffer response body of large or unknown size"
### dari Commons HttpClient 3 (integrasi BNI/BSI/Faspay/Sister). Respons
### gateway berupa JSON kecil sehingga buffering aman; hanya log noise.
log4j.logger.org.apache.commons.httpclient=ERROR

### Redam ERROR BENIGN dari hidrasi Hibernate, mis. spam berulang:
###   "IllegalArgumentException in class: ais.database.model.FormatNilai,
###    setter method of property: kunci ... expected type: Tbmuser, actual value: String".
### Terjadi saat memuat daftar FormatNilai; asosiasi kunci (Tbmuser 'pengunci') gagal
### di-resolve dari nilai kolom sehingga dibiarkan kosong (null). Aplikasi TETAP jalan
### normal (fungsi tak berubah) — ini murni noise. Naikkan ambang logger ke FATAL agar
### ERROR mismatch properti tidak membanjiri log. (Level default lain tak terpengaruh.)
log4j.logger.org.hibernate.property.BasicPropertyAccessor=FATAL
