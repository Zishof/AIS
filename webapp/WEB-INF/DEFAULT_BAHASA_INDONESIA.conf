# ==========================================================================
# DEFAULT SEED TERJEMAHAN - BAHASA INDONESIA
# --------------------------------------------------------------------------
# Berisi NILAI DEFAULT terjemahan Bahasa Indonesia untuk pesan/label.
# Dipakai HANYA saat sebuah kunci PERTAMA KALI di-insert ke tabel LabelBahasa.
# Setelah masuk DB, DB menjadi acuan (perubahan disimpan ke DB, bukan file ini).
# Format : <kunci>=<terjemahan>   (UTF-8, seperti .properties)
# Kunci  : huruf kecil, spasi diganti "_" (sama dengan kolom nama LabelBahasa).
# Biasanya Bahasa Indonesia = teks asli, jadi file ini umumnya boleh kosong.
# Contoh:
# informasi=Informasi
# peringatan=Peringatan
# ==========================================================================
